<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF7FC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gia đình">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Gia đình Nam · Nguyệt · Thóc</title>
<style>
/* Layout: phone-first app shell. Sticky header (tiêu đề, đổi người xem, tiêu đề cột), một vùng cuộn theo tab, thanh tab cố định ở đáy. Màu thành viên và nhóm việc lấy từ bảng 10 màu pastel (--pb nền nhạt, --pd màu đậm). Cột nội dung tối đa 520px. */
:root{
  --bg:#FAF7FC; --surface:#FFFFFF; --soft:#F3EEF8; --ink:#2A2632; --muted:#6B6475; --line:#E7E0EE;
  --accent:#5A4FCF; --on-accent:#FFFFFF;
  --good:#1F7A50; --good-bg:#DDF3E8; --warn:#8A5A00; --warn-bg:#FFEFC7; --bad:#B23A37; --bad-bg:#FBDAD8;
  --pb1:#FFD9C6; --pb2:#FFEDB0; --pb3:#D0E7F6; --pb4:#E3D9F8; --pb5:#D5ECD4; --pb6:#F9D4E0; --pb7:#CDEFEA; --pb8:#FAD0CC; --pb9:#E6EFB8; --pb10:#E4E1E8;
  --pd1:#F08A5D; --pd2:#EE9F2E; --pd3:#5B8DEF; --pd4:#8A6FE0; --pd5:#4CAF7A; --pd6:#E8628D; --pd7:#2BA6A0; --pd8:#D8504D; --pd9:#9AA823; --pd10:#8A8494;
  --shadow:0 1px 2px rgba(42,38,50,.06),0 8px 24px rgba(42,38,50,.06);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --ok:#0ca30c; --crit:#d03b3b; --grid:#e1e0d9; --axis:#c3c2b7; --axisink:#898781;
  --font-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16131B; --surface:#1F1B26; --soft:#28232F; --ink:#F2EEF7; --muted:#A79FB3; --line:#352F40;
    --accent:#A79DFF; --on-accent:#17131F;
    --good:#7FD9AC; --good-bg:#1D3A2D; --warn:#F2C15C; --warn-bg:#40330F; --bad:#F59C99; --bad-bg:#46211F;
    --pb1:#4A3128; --pb2:#4A3F1C; --pb3:#213A4B; --pb4:#38305A; --pb5:#273F2B; --pb6:#4A2634; --pb7:#1F3F3D; --pb8:#4A2321; --pb9:#3D4220; --pb10:#363240;
    --pd1:#F5A57F; --pd2:#F5B85B; --pd3:#7FA6FF; --pd4:#B39DFF; --pd5:#7FD9AC; --pd6:#F58BAE; --pd7:#5FD3CC; --pd8:#F59C99; --pd9:#CBD65B; --pd10:#B3ADBD;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --ok:#0ca30c; --crit:#d03b3b; --grid:#2c2c2a; --axis:#383835; --axisink:#898781;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16131B; --surface:#1F1B26; --soft:#28232F; --ink:#F2EEF7; --muted:#A79FB3; --line:#352F40;
  --accent:#A79DFF; --on-accent:#17131F;
  --good:#7FD9AC; --good-bg:#1D3A2D; --warn:#F2C15C; --warn-bg:#40330F; --bad:#F59C99; --bad-bg:#46211F;
  --pb1:#4A3128; --pb2:#4A3F1C; --pb3:#213A4B; --pb4:#38305A; --pb5:#273F2B; --pb6:#4A2634; --pb7:#1F3F3D; --pb8:#4A2321; --pb9:#3D4220; --pb10:#363240;
  --pd1:#F5A57F; --pd2:#F5B85B; --pd3:#7FA6FF; --pd4:#B39DFF; --pd5:#7FD9AC; --pd6:#F58BAE; --pd7:#5FD3CC; --pd8:#F59C99; --pd9:#CBD65B; --pd10:#B3ADBD;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --ok:#0ca30c; --crit:#d03b3b; --grid:#2c2c2a; --axis:#383835; --axisink:#898781;
  color-scheme:dark;
}
/* Giao diện hồng: bảng màu riêng, nền sáng, bo tròn mềm. Đặt sau các khối tối để thắng khi máy đang ở chế độ tối */
:root[data-theme="rose"]{
  --bg:#FFF4F8; --surface:#FFFFFF; --soft:#FDE6EF; --ink:#3D2233; --muted:#85647A; --line:#F5D0E0;
  --accent:#C93273; --on-accent:#FFFFFF;
  --good:#1F7A50; --good-bg:#DDF3E8; --warn:#8A5A00; --warn-bg:#FFEFC7; --bad:#B23A37; --bad-bg:#FBDAD8;
  --pb1:#FFD9C6; --pb2:#FFEDB0; --pb3:#D0E7F6; --pb4:#E3D9F8; --pb5:#D5ECD4; --pb6:#F9D4E0; --pb7:#CDEFEA; --pb8:#FAD0CC; --pb9:#E6EFB8; --pb10:#E4E1E8;
  --pd1:#F08A5D; --pd2:#EE9F2E; --pd3:#5B8DEF; --pd4:#8A6FE0; --pd5:#4CAF7A; --pd6:#E8628D; --pd7:#2BA6A0; --pd8:#D8504D; --pd9:#9AA823; --pd10:#8A8494;
  --shadow:0 1px 2px rgba(201,50,115,.08),0 10px 28px rgba(201,50,115,.12);
  --s1:#C93273; --s2:#EE8A3A; --s3:#2BA68A; --ok:#0ca30c; --crit:#d03b3b; --grid:#F3DCE6; --axis:#E0BDCD; --axisink:#85647A;
  color-scheme:light;
}
:root[data-theme="rose"] body{background:radial-gradient(120% 55% at 100% 0%,#FFDDEA 0%,transparent 60%),radial-gradient(90% 45% at 0% 100%,#FFE8F1 0%,transparent 55%),var(--bg);background-attachment:fixed}
:root[data-theme="rose"] header{background:rgba(255,244,248,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
:root[data-theme="rose"] h1 .ft{background:linear-gradient(90deg,#C93273,#8E3AA8);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="rose"] .card,:root[data-theme="rose"] .kpi,:root[data-theme="rose"] .ymon{border-radius:22px}
:root[data-theme="rose"] .btn{border-radius:99px}
:root[data-theme="rose"] .btn.primary{background:linear-gradient(135deg,#E0508C,#C02E70)}
:root[data-theme="rose"] .task,:root[data-theme="rose"] .cell{border-radius:16px}
:root[data-theme="rose"] .xt .task{border-radius:9px}
:root[data-theme="rose"] .strip .d,:root[data-theme="rose"] .ch{border-radius:16px}
:root[data-theme="rose"] .xt{border-radius:18px}
:root[data-theme="rose"] .strip .d[aria-pressed="true"],:root[data-theme="rose"] .mday.sel{background:linear-gradient(160deg,#E0508C,#C02E70);color:#fff}
:root[data-theme="rose"] .sheet{border-radius:28px 28px 0 0}
:root[data-theme="rose"] .tabbar{background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 -6px 24px rgba(201,50,115,.10)}
:root[data-theme="rose"] .bar i{background:linear-gradient(90deg,#F27BA9,#C93273)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{width:100%;min-width:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.shell{width:100%;min-width:0;max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px;box-shadow:0 1px 0 var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.1;display:flex;align-items:center;gap:8px;min-width:0}
h1 .ft{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.demo{font-family:var(--font-body);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 7px;flex:none}
.seg{display:inline-flex;background:var(--soft);border-radius:99px;padding:3px;gap:2px;flex:none}
.seg button{padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.colheads{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:6px;margin-top:8px}
.ch{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--surface);border-radius:10px;min-width:0}
.ch b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch span{margin-left:auto;font-size:11px;color:var(--muted)}
.av{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}

main{padding-top:14px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:12px;font-weight:600;background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.page-h{font-family:var(--font-display);font-size:20px;line-height:1.2}

/* Lịch */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav h2{font-family:var(--font-display);font-size:17px;font-weight:700;text-align:center;flex:1}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.iconbtn[disabled]{opacity:.35;cursor:not-allowed}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.strip .d{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:12px;background:var(--surface);position:relative}
.strip .d span{font-size:11px;color:var(--muted);font-weight:600}
.strip .d b{font-size:15px}
.strip .d[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.strip .d[aria-pressed="true"] span{color:inherit;opacity:.85}
.strip .d.today::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.strip .d.today[aria-pressed="true"]::after{background:var(--on-accent)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.hscroll{overflow-x:auto}
.hin{display:flex;flex-direction:column;gap:14px}
.sess{display:flex;flex-direction:column;gap:6px}
.sess-h{display:flex;justify-content:space-between;align-items:baseline;padding-inline:2px}
.sess-h b{font-family:var(--font-display);font-size:15px}
.sess-h span{font-size:11px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:6px;align-items:stretch}
.cell{display:flex;flex-direction:column;gap:5px;padding:3px;border-radius:12px;background:var(--soft);min-width:0;min-height:48px}
.cell.full{background:repeating-linear-gradient(135deg,var(--soft) 0 5px,var(--line) 5px 6px)}
.plab{display:flex;align-items:center;gap:4px;padding:2px 4px;font-size:11px;font-weight:700;color:var(--muted);min-width:0}
.plab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{margin:auto;font-size:11px;color:var(--muted);opacity:.7}
.task{display:flex;align-items:flex-start;gap:5px;padding:6px;border-radius:9px;min-width:0}
.task .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:transparent;background:transparent}
.task .tick .ic{width:13px;height:13px;stroke-width:3}
.task.done .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.task .tx{display:flex;flex-direction:column;text-align:left;min-width:0;flex:1}
.task .tm{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px}
.task .tm .ic{width:10px;height:10px}
.task .nm{font-size:12px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.task.done .nm{text-decoration:line-through;opacity:.55}
.busy{padding:5px 6px;border-radius:8px;font-size:11px;color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px),var(--surface)}
.xt{display:grid;grid-template-columns:48px repeat(var(--n,3),minmax(0,1fr));gap:1px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--line)}
.xt>*{min-width:0;background:var(--surface)}
.xh0,.xh{background:var(--soft)}
.xh{display:flex;align-items:center;gap:5px;padding:8px;font-size:12px;font-weight:700;text-align:left;color:inherit;cursor:pointer}
.xh span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xl{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:8px 2px 0;background:var(--soft)}
.xc{display:flex;flex-direction:column;gap:3px;padding:3px}
.xc.hz{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px),var(--surface)}
.xt .bs{box-shadow:inset 0 2px 0 var(--axis)}
.xt .task{padding:4px 5px;gap:4px;border-radius:7px}
.xt .task .tick{width:18px;height:18px;border-width:2px}
.xt .task .tick .ic{width:11px;height:11px}
.xt .task .nm{font-size:11.5px;line-height:1.25}
.xt .task .tm{font-size:10px}
.xt .busy{background:none;padding:2px 3px;font-size:10.5px}
.ch{text-align:left;border:0;width:100%;cursor:pointer}
.ch:active,.xh:active{transform:scale(.98)}
.plab{background:none;border:0;text-align:left;width:100%;cursor:pointer}
.rule{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;background:var(--soft);text-align:left;width:100%;min-width:0}
.rule b{font-size:14px;font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.rtgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.rtc{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);text-align:left;min-width:0;width:100%}
.rtc .rth{display:flex;align-items:center;gap:6px;min-width:0}
.rtc .rth b{font-size:13.5px;overflow-wrap:anywhere;line-height:1.25}
.rtc.ok{box-shadow:inset 0 0 0 2px var(--good)}
.pt-list{display:flex;flex-direction:column;gap:6px}
.pt-list .task .nm{font-size:14px}.pt-list .task .tm{font-size:12px}.pt-list .task .tick{width:26px;height:26px}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pnext{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;background:var(--soft)}
.pnext b{font-size:15px}
.pbig{display:flex;align-items:center;gap:12px}
.pbig .big{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--bg);flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-top:4px}

/* Tiền */
.sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 14px}
.sum .big{font-family:var(--font-display);font-size:clamp(20px,6.4vw,26px);overflow-wrap:anywhere;font-weight:700;line-height:1.1}
.sum .k{font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
label,legend{font-size:12px;font-weight:600;color:var(--muted)}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
input[type=text],input[type=time],input[type=date],select,textarea{width:100%;font-size:16px;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
textarea{min-height:72px;resize:vertical}
.amt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:0 14px}
.amt input{border:0;background:transparent;font-family:var(--font-display);font-size:28px;font-weight:700;min-height:56px;padding:0;outline:0;min-width:0;width:100%}
.amt:focus-within{outline:2px solid var(--accent)}
.amt span{font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--soft);font-size:13px;font-weight:600;color:var(--ink);border:2px solid transparent}
.chip input:checked + span{border-color:var(--accent);background:var(--surface)}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.chip i{width:10px;height:10px;border-radius:3px}
.fchip{padding:7px 12px;border-radius:99px;background:var(--soft);font-size:13px;font-weight:600;border:2px solid transparent}
.fchip[aria-pressed="true"]{border-color:var(--accent);background:var(--surface)}
.hint{font-size:12px;color:var(--muted)}
.fund{display:flex;flex-direction:column;gap:8px}
.fund .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fund h3{font-size:15px;font-weight:700}
.fund .rem{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1}
.fund .det{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.fund .bar i{background:var(--good)}
.fund.warn .bar i{background:var(--warn)}
.fund.bad .bar i{background:var(--bad)}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.carry{font-size:12px;background:var(--soft);border-radius:8px;padding:6px 8px;color:var(--muted)}
.tx-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tx-row:first-child{border-top:0}
.tx-row .t{flex:1;min-width:0}
.tx-row .t b{display:block;font-size:13.5px;overflow-wrap:anywhere}
.tx-row .t small{color:var(--muted);font-size:12px}
.tx-row .a{font-weight:700;white-space:nowrap}

/* Mua đồ */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters .fchip{white-space:nowrap}
.req{display:flex;flex-direction:column;gap:10px}
.rtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rtop h3{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.price{font-family:var(--font-display);font-size:17px;white-space:nowrap}

/* Sheet */
.overlay{position:fixed;inset:0;background:rgba(20,16,26,.5);display:flex;align-items:flex-end;justify-content:center;z-index:40}

@keyframes pop{0%{transform:scale(.4) rotate(-14deg)}60%{transform:scale(1.3) rotate(8deg)}100%{transform:none}}
</style>

  CFG={an:{ev:0,f:.8,r:45,w:62},ct:{ev:9,f:.75,r:55,w:45},dp:{ev:2,f:.3,r:90,w:50},qd:{ev:3,f:.5,r:60,w:55}};
  for(var m=0;m<12;m++){
    var N=new Date(ty,m+1,0).getDate(),ym=ty+'-'+pad(m+1);
    if(ym+'-01'>=today)break;
    FUNDS.forEach(function(f){
      if(f.kind==='save')return;
      var plan=[],i;
      if(f.id==='nha')plan.push({d:1,a:f.alloc,t:'Thuê nhà tháng '+(m+1),w:'nam'});

      else{
        var c=CFG[f.id]||{ev:5,f:.8,r:40,w:50},ev=c.ev||N,target=f.alloc*(c.f+rnd(f.id+ym)%c.r/100),ws=[],sw=0;
        for(i=0;i<ev;i++){var w=.5+rnd(f.id+ym+i)/100;ws.push(w);sw+=w}
        for(i=0;i<ev;i++){
          var d=Math.min(N,Math.max(1,Math.floor((i+.5)*N/ev)+rnd(f.id+ym+'d'+i)%3-1));
          plan.push({d:d,a:Math.max(10000,Math.round(target*ws[i]/sw/1000)*1000),t:NOTES[f.id]?NOTES[f.id][rnd(f.id+ym+'n'+i)%NOTES[f.id].length]:f.n,w:rnd(f.id+ym+'w'+i)<c.w?'nguyet':'nam'});
        }

      }
      plan.forEach(function(p){var date=ym+'-'+pad(p.d);if(date<today)out.push({id:'g'+(++n),date:date,fund:f.id,who:p.w,note:p.t,amt:p.a})});
    });
  }
  out.push({id:'xp',date:addDays(today,-4),fund:'dp',who:'nam',note:'Nhiệt kế điện tử',amt:350000,src:'purchase'});
  out.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
  return out;
}

function gridHTML(day,W){

/* ---------- Tiền ---------- */
var KIND={fixed:'Chi cố định',need:'Thiết yếu',want:'Mong muốn',save:'Tiết kiệm'};
var PER=[['day','Ngày'],['week','Tuần'],['month','Tháng'],['quarter','Quý'],['year','Năm']];
var STL={good:'✓ Tốt',warn:'! Cần chú ý',bad:'✕ Báo động'};
var fmtK=function(n){var a=Math.abs(n);if(a>=1e6)return (n/1e6).toFixed(1).replace('.',',').replace(/,0$/,'')+'tr';if(a>=1e3)return Math.round(n/1e3)+'k';return String(Math.round(n))};
var pctS=function(x){return (Math.round(x*1000)/10).toString().replace('.',',')+'%'};
var sumAmt=function(l){return l.reduce(function(s,t){return s+t.amt},0)};
function diffDays(a,b){return Math.round((parseKey(b)-parseKey(a))/864e5)}
function dim(k){var d=parseKey(k);return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()}
function periodRange(type,k){
  var d=parseKey(k),y=d.getFullYear(),m=d.getMonth();
  if(type==='day')return {s:k,e:k};
  if(type==='week'){var mo=mondayOf(k);return {s:mo,e:addDays(mo,6)}}
  if(type==='month')return {s:keyOf(new Date(y,m,1)),e:keyOf(new Date(y,m+1,0))};
  if(type==='quarter'){var q=Math.floor(m/3);return {s:keyOf(new Date(y,q*3,1)),e:keyOf(new Date(y,q*3+3,0))}}
  return {s:y+'-01-01',e:y+'-12-31'};
}
function shiftPeriod(type,k,n){
  if(type==='day')return addDays(k,n);
  if(type==='week')return addDays(k,7*n);
  if(type==='month')return shiftMonth(k,n);
  if(type==='quarter')return shiftMonth(k,3*n);

}
function periodLabel(type,k){

  if(type==='month')return 'Tháng '+(d.getMonth()+1)+'/'+d.getFullYear();
  if(type==='quarter')return 'Quý '+(Math.floor(d.getMonth()/3)+1)+'/'+d.getFullYear();
  return 'Năm '+d.getFullYear();
}
function endOf(rg){return rg.e<today?rg.e:today}
function elapsed(rg){return Math.max(0,diffDays(rg.s,endOf(rg))+1)}
function spendFunds(ff){return FUNDS.filter(function(f){return f.kind!=='save'&&(ff==='all'||f.id===ff)})}
function dayCap(f,k){return f.capDay>0?f.capDay:f.alloc/dim(k)}
function weekCap(f,k){
  if(f.capWeek>0)return f.capWeek;
  var mo=mondayOf(k),s=0;for(var i=0;i<7;i++)s+=dayCap(f,addDays(mo,i));return s;
}
function capHintText(a){

}
/* ngân sách của một quỹ trong kỳ, chỉ tính phần đã trôi qua đến hôm nay */
function fundBudget(f,type,rg){
  var end=endOf(rg),k,s=0;
  if(end<rg.s||f.kind==='save')return 0;
  if(f.kind==='fixed'){
    if(type==='day'||type==='week'||rg.e>=today){for(k=rg.s;k<=end;k=addDays(k,1))s+=f.alloc/dim(k);return s}
    var c=parseKey(rg.s),e=parseKey(end),y=c.getFullYear(),m=c.getMonth(),n=0;
    while(new Date(y,m,1)<=e){n++;m++;if(m>11){m=0;y++}}
    return n*f.alloc;
  }
  if(type==='week'&&f.capWeek>0)return f.capWeek*(diffDays(rg.s,end)+1)/7;
  for(k=rg.s;k<=end;k=addDays(k,1))s+=dayCap(f,k);
  return s;
}
function srcOk(i,iw,is){return (iw==='all'||(i.who||'_')===iw)&&(is==='all'||i.id===is)}
function logList(rg,srcs){
  var ids={};srcs.forEach(function(i){ids[i.id]=1});
  return INCLOG.filter(function(e){return ids[e.src]&&e.date>=rg.s&&e.date<=rg.e});
}
/* Thu nhập thực nhận trong kỳ. Ngày và tuần chia đều thu nhập đã nhận của tháng chứa ngày đó, vì lương chỉ về một ngày */
function incomeIn(rg,who,smooth){
  var srcs=INCOMES.filter(function(i){return !who||i.who===who});
  if(!smooth)return sumAmt(logList(rg,srcs));
  var end=endOf(rg),t=0,cache={};
  for(var k=rg.s;k<=end;k=addDays(k,1)){var ym=k.slice(0,7);if(cache[ym]===undefined)cache[ym]=sumAmt(logList(periodRange('month',k),srcs));t+=cache[ym]/dim(k)}
  return t;
}
function monthIncome(){return sumAmt(logList(periodRange('month',today),INCOMES))}
function txIn(rg,ff){
  var out=[];
  for(var i=0;i<TX.length;i++){
    var t=TX[i];if(t.date<rg.s||t.date>rg.e)continue;
    var f=fundById(t.fund);if(!f||f.kind==='save')continue;
    if(ff!=='all'&&t.fund!==ff)continue;
    out.push(t);
  }
  return out;
}
function sumFundRange(fid,s,e){var x=0;for(var i=0;i<TX.length;i++){var t=TX[i];if(t.fund===fid&&t.date>=s&&t.date<=e)x+=t.amt}return x}
function payers(){
  var seen={},out=[];
  accts().forEach(function(i){seen[i]=1;out.push(i)});
  TX.forEach(function(t){if(!seen[t.who]&&M[t.who]){seen[t.who]=1;out.push(t.who)}});
  return out;
}

/* ---- đánh giá lành mạnh ---- */
function healthCalc(type,k){
  var rg=periodRange(type,k),list=txIn(rg,'all'),short=(type==='day'||type==='week'||rg.e>=today),a={fixed:0,need:0,want:0};
  list.forEach(function(t){var kd=fundById(t.fund).kind;if(!a.hasOwnProperty(kd))kd='want';a[kd]+=t.amt});
  var fixedUse=a.fixed,flexBud=0;
  if(short){fixedUse=0;FUNDS.forEach(function(f){if(f.kind==='fixed')fixedUse+=fundBudget(f,type,rg)})}
  FUNDS.forEach(function(f){if(f.kind==='need'||f.kind==='want')flexBud+=fundBudget(f,type,rg)});
  var inc=incomeIn(rg,null,type==='day'||type==='week'),needs=a.need+fixedUse,wants=a.want,spend=needs+wants;
  return {rg:rg,inc:inc,fixedUse:fixedUse,needs:needs,wants:wants,spend:spend,net:inc-spend,flexSpend:a.need+a.want,flexBud:flexBud,short:short};
}
function runway(){
  var bal=0,s=0,n=0;
  FUNDS.forEach(function(f){if(f.kind==='save')bal+=f.carry||0});
  for(var i=1;i<=3;i++){var h=healthCalc('month',shiftMonth(today,-i));if(h.needs>0){s+=h.needs;n++}}
  return n&&bal>=0?{bal:bal,avg:s/n,months:bal/(s/n)}:null;
}
function evalHealth(type,k){

  ind.push({n:'Chi thiết yếu trên thu nhập',w:15,st:hi?lvl(B,.5,.6,false):'',text:hi?pctS(B):'Chưa có thu nhập',target:'Tối đa 50% thu nhập, cảnh báo từ 60%.',note:hi?vnd(h.needs)+' gồm chi cố định và chi thiết yếu. '+shortNote:noInc});

  ind.push({n:'Chi tiêu so với giới hạn ngày và tuần',w:20,st:h.flexBud>0?lvl(h.flexSpend/h.flexBud,1,1.15,false):'',text:h.flexBud>0?pctS(h.flexSpend/h.flexBud):'Chưa có giới hạn',target:'Không vượt giới hạn của các quỹ thiết yếu và mong muốn, cho lệch tới 115%.',note:h.flexBud>0?'Đã chi '+vnd(h.flexSpend)+' / giới hạn '+vnd(h.flexBud)+'.':'Đặt loại khoản chi ở Cài đặt.'});
  ind.push({n:'Chi nhà ở và hóa đơn trên thu nhập',w:10,st:hi?lvl(E,.3,.35,false):'',text:hi?pctS(E):'Chưa có thu nhập',target:'Tối đa khoảng 30% thu nhập, là mức tham khảo.',note:hi?vnd(h.fixedUse)+' cho các khoản chi cố định. '+shortNote:noInc});
  ind.push({n:'Quỹ tiết kiệm đủ bao nhiêu tháng',w:15,st:R?lvl(R.months,3,1,true):'',text:R?(Math.round(R.months*10)/10).toString().replace('.',',')+' tháng':'Chưa đủ dữ liệu',target:'Từ 3 đến 6 tháng chi thiết yếu, gần 6 tháng nếu một người đi làm nuôi cả nhà.',note:R?'Số dư '+vnd(R.bal)+' / chi thiết yếu trung bình '+vnd(R.avg)+' mỗi tháng.':''});

function trendData(type,k){
  var sub,keys=[],i;
  if(type==='week'){sub='week';for(i=7;i>=0;i--)keys.push(addDays(k,-7*i))}
  else if(type==='month'){sub='month';for(i=5;i>=0;i--)keys.push(shiftMonth(k,-i))}
  else if(type==='quarter'){sub='quarter';for(i=3;i>=0;i--)keys.push(shiftMonth(k,-3*i))}
  else{sub='month';var y=parseKey(k).getFullYear();for(i=0;i<12;i++)keys.push(keyOf(new Date(y,i,1)))}
  return keys.map(function(kk){
    var rg=periodRange(sub,kk),d=parseKey(rg.s),na=rg.s>today,hc=na?null:healthCalc(sub,kk);
    return {l:sub==='week'?dm(rg.s):sub==='month'?'T'+(d.getMonth()+1):'Q'+(Math.floor(d.getMonth()/3)+1),tl:periodLabel(sub,kk),na:na,v:hc?hc.net:0};
  });
}

/* ---- biểu đồ cột (SVG) ---- */
function niceStep(raw){if(raw<=0)return 1;var p=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),r=raw/p;return (r<=1?1:r<=2?2:r<=5?5:10)*p}
function chartSVG(bars,o){
  var W=360,H=o.h||176,pl=40,pr=8,pt=16,pb=24,iw=W-pl-pr,ih=H-pt-pb,n=bars.length,i,vs=[0];
  for(i=0;i<n;i++){if(!bars[i].na){vs.push(bars[i].v);if(bars[i].cap)vs.push(bars[i].cap)}}
  var mx=Math.max.apply(null,vs),mn=o.diverge?Math.min.apply(null,vs):0;
  if(mx===0&&mn===0)mx=1;
  var step=niceStep((mx-mn)/4);mx=Math.ceil(mx/step)*step;mn=Math.floor(mn/step)*step;
  if(mx===mn)mx=mn+step;
  var y=function(v){return pt+ih*(1-(v-mn)/(mx-mn))},y0=y(0);
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label)+'">',cnt=Math.round((mx-mn)/step),j;
  for(j=0;j<=cnt;j++){
    var tv=mn+j*step,ty=y(tv);
    s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+ty+'" y2="'+ty+'" stroke="var('+(tv===0?'--axis':'--grid')+')" stroke-width="1"/>';
    s+='<text x="'+(pl-6)+'" y="'+(ty+3)+'" text-anchor="end">'+fmtK(tv)+'</text>';
  }
  var bw=iw/n,barw=Math.min(24,bw*.62),skip=n>16?5:1,lab=n<=8;
  for(i=0;i<n;i++){
    var b=bars[i],x=pl+i*bw+(bw-barw)/2,cx=pl+i*bw+bw/2;
    if(!b.na&&b.v!==0){
      var top=y(b.v),h=Math.max(1,Math.abs(top-y0)),r=Math.min(4,h/2),fill='var(--'+b.c+')',d;
      if(b.v>0)d='M'+x+','+y0+'L'+x+','+(y0-h+r)+'Q'+x+','+(y0-h)+' '+(x+r)+','+(y0-h)+'L'+(x+barw-r)+','+(y0-h)+'Q'+(x+barw)+','+(y0-h)+' '+(x+barw)+','+(y0-h+r)+'L'+(x+barw)+','+y0+'Z';
      else d='M'+x+','+y0+'L'+x+','+(y0+h-r)+'Q'+x+','+(y0+h)+' '+(x+r)+','+(y0+h)+'L'+(x+barw-r)+','+(y0+h)+'Q'+(x+barw)+','+(y0+h)+' '+(x+barw)+','+(y0+h-r)+'L'+(x+barw)+','+y0+'Z';
      s+='<path d="'+d+'" style="fill:'+fill+'"/>';
      if(lab)s+='<text class="vl" x="'+cx+'" y="'+(b.v>0?y0-h-4:y0+h+11)+'" text-anchor="middle">'+fmtK(b.v)+'</text>';
    }
    if(!b.na&&b.cap>0)s+='<line x1="'+(cx-bw*.42)+'" x2="'+(cx+bw*.42)+'" y1="'+y(b.cap)+'" y2="'+y(b.cap)+'" stroke="var(--ink)" stroke-width="2"/>';
    if(i%skip===0||(skip>1&&i===n-1&&(n-1)%skip>=2))s+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+esc(b.l)+'</text>';
    s+='<rect class="cbar" tabindex="0" x="'+(pl+i*bw)+'" y="'+pt+'" width="'+bw+'" height="'+ih+'" data-tip="'+esc(b.tip)+'" aria-label="'+esc(b.tip)+'"/>';
  }
  return s+'</svg>';
}

function limitCheck(fid,date,extra){
  var f=fundById(fid),out=[],lv='',ex=extra||0;
  if(!f||(f.kind!=='need'&&f.kind!=='want'))return {level:'',msgs:[]};
  var wk=periodRange('week',date),mo=periodRange('month',date),dl=(date===today?'Hôm nay':'Ngày '+dm(date));
  [['day',dl,date,date,dayCap(f,date),'giới hạn ngày'],['week','Tuần này',wk.s,wk.e,weekCap(f,date),'giới hạn tuần'],['month','Tháng này',mo.s,mo.e,f.alloc,'quỹ tháng']].forEach(function(c){
    var sp=sumFundRange(fid,c[2],c[3])+ex,p=c[4]>0?sp/c[4]:0;
    if(p>1){out.push({lv:'bad',t:c[1]+' quỹ '+f.n+' đã chi '+vnd(sp)+', vượt '+c[5]+' '+vnd(Math.round(c[4]))+' là '+vnd(Math.round(sp-c[4]))+'.'});}

  });
  out.sort(function(a,b){return a.lv===b.lv?0:a.lv==='bad'?-1:1});
  return {level:out.length?out[0].lv:'',msgs:out.map(function(o){return o.t})};
}

function chipRow(act,cur,items){
  return '<div class="filters" role="group">'+items.map(function(o){
    return '<button type="button" class="fchip" data-act="'+act+'" data-v="'+o[0]+'" aria-pressed="'+(cur===o[0])+'">'+(o[2]||'')+esc(o[1])+'</button>';

function kpi(k,v,sub,cls){return '<div class="kpi"><span class="k">'+k+'</span><b class="num'+(cls?' '+cls:'')+'">'+v+'</b><small>'+sub+'</small></div>'}
function statChart(tp,rg,list){
  if(tp==='day')return '';
  var bars=[],k,i,over=0,counted=0,excl=(S.ff==='all'),dailyTp=(tp==='week'||tp==='month'),fs=spendFunds(S.ff),title=dailyTp?'Chi theo ngày':'Chi theo tháng';
  if(dailyTp){
    var byDay={};
    list.forEach(function(t){if(excl&&fundById(t.fund).kind==='fixed')return;byDay[t.date]=(byDay[t.date]||0)+t.amt});
    for(k=rg.s;k<=rg.e;k=addDays(k,1)){
      var cap=0,v=byDay[k]||0,na=k>today,kk=k;
      if(S.fw==='all')fs.forEach(function(f){if(f.kind==='need'||f.kind==='want')cap+=dayCap(f,kk)});
      var ov=!na&&cap>0&&v>cap;if(!na&&cap>0)counted++;if(ov)over++;
      bars.push({l:tp==='week'?WD[dow(k)]:String(parseKey(k).getDate()),tl:WD[dow(k)]+' '+dm(k),v:v,cap:cap,na:na,c:ov?'crit':'s1',
        tip:WD[dow(k)]+' '+dm(k)+': '+vnd(v)+(cap>0?' · giới hạn '+vnd(Math.round(cap))+(ov?' · vượt '+vnd(Math.round(v-cap)):''):'')});
    }
  }else{
    var s0=parseKey(rg.s),cnt=tp==='quarter'?3:12;
    for(i=0;i<cnt;i++){
      var first=keyOf(new Date(s0.getFullYear(),s0.getMonth()+i,1)),mr=periodRange('month',first),mna=first>today,mv=0,mc=0;
      list.forEach(function(t){if(t.date>=mr.s&&t.date<=mr.e)mv+=t.amt});
      if(S.fw==='all')fs.forEach(function(f){mc+=fundBudget(f,'month',mr)});
      var mo=!mna&&mc>0&&mv>mc;if(!mna&&mc>0)counted++;if(mo)over++;
      var mi=parseKey(first).getMonth()+1;
      bars.push({l:'T'+mi,tl:'Tháng '+mi,v:mv,cap:mc,na:mna,c:mo?'crit':'s1',
        tip:'Tháng '+mi+': '+vnd(mv)+(mc>0?' · ngân sách '+vnd(Math.round(mc))+(mo?' · vượt '+vnd(Math.round(mv-mc)):''):'')});
    }
  }
  var hasCap=bars.some(function(b){return b.cap>0});
  return '<div class="card" style="display:flex;flex-direction:column;gap:8px"><div class="row between"><b>'+title+'</b>'+(hasCap?'<span class="hint num">Vượt '+over+'/'+counted+(dailyTp?' ngày':' tháng')+'</span>':'')+'</div>'+
    '<div class="chartbox">'+chartSVG(bars,{label:title+', '+periodLabel(tp,S.mdate)})+'<div class="tip" hidden></div></div>'+
    '<div class="legend2"><span><i class="keyb" style="background:var(--s1)"></i>'+(hasCap?'Trong giới hạn':'Chi tiêu')+'</span>'+(hasCap?'<span><i class="keyb" style="background:var(--crit)"></i>Vượt giới hạn</span><span><i class="keyl"></i>Vạch '+(dailyTp?'giới hạn ngày':'ngân sách tháng')+'</span>':'')+'</div>'+
    (dailyTp&&excl?'<p class="note">Biểu đồ ngày không gồm chi cố định (thuê nhà, hóa đơn).</p>':'')+
    tableView(bars,hasCap?(dailyTp?'Giới hạn':'Ngân sách'):'')+'</div>';
}

/* ---- Đánh giá ---- */
function splitBar(h){
  if(h.inc<=0)return '';
  var base=Math.max(h.inc,h.spend),left=h.inc-h.spend,parts=[['Thiết yếu',h.needs,'s1'],['Mong muốn',h.wants,'s2']];
  if(left>0)parts.push(['Tiết kiệm',left,'s3']);
  var aria=parts.map(function(p){return p[0]+' '+pctS(p[1]/h.inc)+' thu nhập'}).join(', ');
  return '<div><div class="segbar" role="img" aria-label="'+esc(aria)+'">'+parts.filter(function(p){return p[1]>0}).map(function(p){
    var share=p[1]/base;return '<div style="flex-grow:'+p[1]+';background:var(--'+p[2]+')">'+(share>=.13?pctS(p[1]/h.inc):'')+'</div>';
  }).join('')+'</div><div class="legend2" style="margin-top:8px">'+parts.map(function(p){return '<span><i class="keyb" style="background:var(--'+p[2]+')"></i>'+p[0]+'</span>'}).join('')+'</div></div>';
}

    if(p==='fam/core')return;

function persist(now){

function flush(){
  if(!SYNC.db||!SYNC.ready||SYNC.ro)return;
  if(SYNC.busy){SYNC.again=true;return}
  var docs=buildDocs(),ops=[];
  Object.keys(docs).forEach(function(p){var j=sj(docs[p]);if(SYNC.last[p]!==j)ops.push({p:p,d:docs[p],j:j})});
  Object.keys(SYNC.last).forEach(function(p){if(!(p in docs))ops.push({p:p,d:null})});
  if(!ops.length){if(SYNC.st==='saving'||SYNC.st==='error')setSt('saved');return}
  SYNC.busy=true;setSt('saving');
  var fail=function(e,o,old){
    SYNC.busy=false;
    if(old===undefined)delete SYNC.last[o.p];else SYNC.last[o.p]=old;
    if(e&&e.code==='invalid_argument'){SYNC.ro=true;setSt('ro');return}
    setSt('error');
    if(e&&e.code==='quota_exceeded'){toast('Kho lưu trữ đã đầy, chưa lưu được');return}
    clearTimeout(SYNC.timer);SYNC.timer=setTimeout(flush,Math.min(30000,2000*(++SYNC.retry)));
  };
  var next=function(){
    var o=ops.shift();
    if(!o){SYNC.busy=false;SYNC.retry=0;if(SYNC.again){SYNC.again=false;flush()}else setSt('saved');return}
    var ref=SYNC.db.doc(o.p),old=SYNC.last[o.p];
    try{
      if(o.d){SYNC.last[o.p]=o.j;ref.set(o.d).then(next,function(e){fail(e,o,old)})}
      else{delete SYNC.last[o.p];ref.delete().then(next,function(e){fail(e,o,old)})}
    }catch(e){fail(e,o,old)}
  };
  next();
}

      var txt=String(c.v),k=xlNorm(txt),g=/tro choi/.test(k)&&/^choi/.test(k)?(/van dong/.test(k.split(':')[0])?'van':/tri tue/.test(k.split(':')[0])?'tri':/ngon ngu/.test(k.split(':')[0])?'ngon':''):'';
      if(!g)return;
      var body=txt.slice(txt.indexOf(':')+1);
      body.split(/\.(?=[^\s.])/).forEach(function(seg){
        var m=seg.trim().match(/^(.+?):\s*([\s\S]+)$/);if(!m)return;
        var n=m[1].replace(/\.\s+/g,' / ').replace(/\s+/g,' ').trim().slice(0,60),d=m[2].replace(/\s+/g,' ').trim().replace(/\.$/,'').slice(0,300),key=g+'|'+xlNorm(n);
        if(seen[key])return;seen[key]=1;out.push({g:g,n:n,d:d});
      });
    });
  });
  return out;
}
/* Một số dòng trong file gốc viết không dấu. Bảng này khôi phục dấu cho đúng các dòng đó; dòng khác giữ nguyên. */
var XL_FIX={
 'giu chu tin kbiet or k chac chan k noi':'Giữ chữ tín, không biết hoặc không chắc chắn thì không nói',
 'kiem che su nong gian':'Kiềm chế sự nóng giận',
 'khong noi nhung loi vo nghia':'Không nói những lời vô nghĩa',
 'gji chep chi tieu':'Ghi chép chi tiêu',
 'dat han muc chi tieu moi thang':'Đặt hạn mức chi tiêu mỗi tháng',
 'len ke hoach cho nhung monm do can mua':'Lên kế hoạch cho những món đồ cần mua',
 'chat luong so lluong mua do ben dung nhieu dip k chay theo xu huong':'Chất lượng & số lượng: mua đồ bền, dùng được nhiều dịp, không chạy theo xu hướng',
 'dau tu':'Đầu tư'

function xlSq(x){return xlNorm(x).replace(/[^a-z0-9]+/g,' ').trim()}
function xlRules(X,wb){
  var out=[],seen={},GM=[[/^ve tu duy|^ve loi song|^ve giao tiep/,'song'],[/^ve chi tieu/,'tien']];
  wb.SheetNames.forEach(function(sn){
    var ws=wb.Sheets[sn];if(!ws['!ref'])return;
    var rg=X.utils.decode_range(ws['!ref']),r,c;
    for(r=rg.s.r;r<=Math.min(rg.e.r,rg.s.r+6);r++)for(c=rg.s.c;c<=rg.e.c;c++){
      var k=xlNorm(xlText(X,ws,r,c)),g='';
      GM.forEach(function(x){if(x[0].test(k))g=x[1]});
      if(!g)continue;
      for(var q=r+1;q<=rg.e.r;q++){
        var tx=xlText(X,ws,q,c);if(!tx)break;
        tx=tx.replace(/^[-–•]\s*/,'').trim();var key=g+'|'+xlNorm(tx);
        if(!tx||seen[key])continue;seen[key]=1;
        var fx=XL_FIX[xlSq(tx)];
        out.push({t:fx||(tx.charAt(0).toUpperCase()+tx.slice(1)),g:g,who:'',from:'',to:'',fixed:!!fx});
      }
    }
  });
  return out;
}
function xlParse(X,wb){
  var warn=[],res={sched:null,money:null,reqs:[],warn:warn},find=function(re){for(var i=0;i<wb.SheetNames.length;i++)if(re.test(xlNorm(wb.SheetNames[i])))return wb.Sheets[wb.SheetNames[i]];return null};
  var sw=find(/thoi quen/),mw=find(/quan ly tien/),gw=find(/^muc tieu/);
  if(gw)res.goals=xlGoals(X,gw);
  res.play=xlPlay(X,wb);
  if(sw){res.sched=xlSchedule(X,sw);if(!res.sched)warn.push('Sheet THÓI QUEN không có hàng tên người (Nam, Nguyệt, Thóc) khớp với thành viên trong app.')}
  if(mw){res.money=xlMoney(X,mw,warn);res.reqs=xlReqs(X,mw)}
  res.rules=xlRules(X,wb).concat(res.sched&&res.sched.rules?res.sched.rules:[]);
  res.fixed=res.rules.filter(function(q){return q.fixed}).length;
  return res;
}
function xlRead(input){
  var file=input.files&&input.files[0];if(!file)return;
  toast('Đang đọc file…');
  var rd=new FileReader();
  rd.onload=function(){
    loadXLSX().then(function(X){
      var wb=X.read(new Uint8Array(rd.result),{type:'array',cellStyles:true});
      XL=xlParse(X,wb);XL.file=file.name;
      var any=(XL.sched&&XL.sched.cols.some(function(c){return c.tasks.length}))||(XL.money&&(XL.money.funds.length||XL.money.tx.length))||XL.reqs.length||(XL.goals&&XL.goals.list.length)||(XL.play&&XL.play.length)||(XL.rules&&XL.rules.length);
      if(!any){toast('Không tìm thấy lịch, chi tiêu hay yêu cầu mua đồ nào trong file này');return}
      openSheet({type:'xl'});
    }).catch(function(e){toast(window.XLSX?'Không đọc được file này. Hãy thử lưu lại thành .xlsx.':'Cần có mạng để tải bộ đọc Excel lần đầu.')});
  };
  rd.onerror=function(){toast('Không mở được file')};
  rd.readAsArrayBuffer(file);input.value='';
}

      X.reqs.map(function(q){return '<div class="row between" style="font-size:13px"><span>'+esc(q.name)+'</span><span class="num">'+vnd(q.price)+'</span></div>'}).join('')+'</div>';

    h+='<div class="card" style="box-shadow:none;background:var(--soft);display:flex;flex-direction:column;gap:6px"><label class="check"><input type="checkbox" id="xl-rules" checked><span>'+X.rules.length+' quy tắc'+(nt?' ('+nt+' có khung giờ nhắc)':'')+'<small>Từ cột tư duy, giao tiếp, lối sống và cột chi tiêu trong Trang tính3, cùng các ghi chú về điện thoại trong lịch. '+(X.fixed?'Đã tự thêm dấu cho '+X.fixed+' dòng viết không dấu trong file, bạn đọc lại cho đúng ý. ':'')+'Quy tắc trùng sẽ bỏ qua.</small></span></label>'+

function xlApply(){
  var X=XL,on=function(id){var e=$('#'+id);return !!(e&&e.checked)},msg=[];
  if(X.sched&&on('xl-sched')){
    var ap=(document.querySelector('#sheet input[name=xl-apply]:checked')||{}).value||'day',nowe=on('xl-nowe'),dates=[],mon=mondayOf(S.date),i;
    if(ap==='day')dates=[S.date];else for(i=0;i<(ap==='week'?7:28);i++)dates.push(addDays(mon,i));
    dates.forEach(function(k){
      var we=(dow(k)===0||dow(k)===6),tasks=[],busy=[];
      X.sched.cols.forEach(function(c){
        c.tasks.forEach(function(t){if(M[c.id]&&!M[c.id].gone)tasks.push(Object.assign({},t,{id:uid('t')}))});
        if(!(nowe&&we))c.busy.forEach(function(b){if(M[b.who]&&!M[b.who].gone)busy.push(Object.assign({},b))});
      });
      tasks.sort(function(a,b){return mins(a.t)-mins(b.t)});
      S.days[k]={tasks:tasks,busy:busy,rt:(S.days[k]&&S.days[k].rt)||{}};
    });
    msg.push('lịch '+dates.length+' ngày');
  }
  if(X.sched&&on('xl-rt')){
    var nrt=0;
    X.sched.routines.forEach(function(q){
      if(ROUTINES.some(function(x){return xlNorm(x.n)===xlNorm(q.n)&&x.who===q.who}))return;
      ROUTINES.push({id:uid('rt'),n:q.n,who:q.who,steps:q.steps.map(function(t){return {id:uid('s'),t:t}})});nrt++;
    });
    msg.push(nrt+' thói quen');
  }
  if(X.money&&on('xl-funds')){X.money.funds.forEach(function(f){var q=fundById(f.id);if(q)q.alloc=f.amt});msg.push(X.money.funds.length+' quỹ')}
  if(X.money&&on('xl-tx')){
    var have={},ex={},seen={},add=0;
    TX.forEach(function(t){have[t.id]=1;if(t.src==='excel'){var k0=t.date+'|'+t.fund+'|'+t.amt;ex[k0]=(ex[k0]||0)+1}});
    X.money.tx.forEach(function(t){
      var k=t.date+'|'+t.fund+'|'+t.amt;seen[k]=(seen[k]||0)+1;
      if(seen[k]<=(ex[k]||0))return; /* đã nhập từ lần trước */
      var seq=0;while(have['xl-'+t.date+'-'+t.fund+'-'+t.amt+'-'+seq])seq++;
      var id='xl-'+t.date+'-'+t.fund+'-'+t.amt+'-'+seq;have[id]=1;
      TX.push({id:id,date:t.date,fund:t.fund,who:S.viewer,note:fundById(t.fund).n,amt:t.amt,src:'excel'});add++;
    });
    TX.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
    msg.push(add+' khoản chi');
  }
  if(X.rules&&on('xl-rules')){
    var nru=0;
    X.rules.forEach(function(q){
      if(RULES.some(function(x){return xlNorm(x.t)===xlNorm(q.t)&&x.who===q.who}))return;
      RULES.push({id:uid('ru'),t:q.t,g:q.g,who:q.who,from:q.from,to:q.to});nru++;
    });
    msg.push(nru+' quy tắc');
  }
  if(X.play&&on('xl-play')){
    var npl=0;
    X.play.forEach(function(p){
      if(PLAY.some(function(x){return x.g===p.g&&xlNorm(x.n)===xlNorm(p.n)}))return;
      PLAY.push({id:uid('p'),g:p.g,n:p.n,d:p.d});npl++;
    });
    msg.push(npl+' trò chơi');
  }
  if(X.goals&&on('xl-goals')){
    var gyv=+((document.querySelector('#sheet input[name=xl-gy]:checked')||{}).value)||S.gy,ng=0;
    X.goals.list.forEach(function(g){
      if(GOALS.some(function(x){return x.y===gyv&&xlNorm(x.t)===xlNorm(g.t)}))return;
      GOALS.push({id:uid('g'),t:g.t,y:gyv,note:'',done:g.done,extra:g.extra});ng++;
    });
    S.gy=gyv;msg.push(ng+' mục tiêu');
  }
  if(on('xl-req')){
    var nr=0,oth=othersOf(S.viewer);
    X.reqs.forEach(function(q){
      if(REQS.some(function(x){return xlNorm(x.name)===xlNorm(q.name)}))return;
      REQS.unshift({id:uid('r'),name:q.name,reason:q.reason||'(chưa ghi lý do)',price:q.price,need:q.need,by:S.viewer,approved:q.approved,approvedBy:q.approved?(oth[0]||S.viewer):undefined,rejected:false,bought:false});nr++;
    });
    msg.push(nr+' yêu cầu mua đồ');
  }
  return msg.length?'Đã nhập: '+msg.join(', '):'Chưa chọn mục nào để nhập';
}
function resetData(mode){
  if(mode==='sample'){
    var D=JSON.parse(SYNC.defaults);applyDocs(D,true,false);
  }else{
    TX=[];INCLOG=[];REQS.length=0;S.days={};
  }
  S.alert=null;S.draft.amount='';S.draft.note='';
}

  var sig=activeRules().map(function(r){return r.id}).join(',');

})();
